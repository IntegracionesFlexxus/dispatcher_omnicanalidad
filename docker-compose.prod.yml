version: '3.8'

services:
  # Dispatcher - Aplicación principal (múltiples réplicas, sin Redis)
  dispatcher:
    image: dispatcher:latest
    build:
      context: .
      target: runtime
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    restart: always
    healthcheck:
      disable: true
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
