version: '3.8'

services:
  # Dispatcher - Aplicación principal (sin Redis, usa almacenamiento en memoria)
  dispatcher:
    build:
      context: .
      target: runtime
    container_name: dispatcher-app
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      # Hot reload en desarrollo - montar código fuente
      - ./src:/app/src
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      disable: true
