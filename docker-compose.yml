version: '3.9'
services:
  dispatcher:
    build:
      context: .
      target: runtime
    image: fabreguesm/dispatcher_omnicanalidad-dispatcher:1.0.1
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      # Hot reload en desarrollo - montar código fuente
      - ./src:/app/src
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      disable: true
